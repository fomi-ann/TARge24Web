<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS String</title>
</head>
<body>
    <p>indexOf() ja lastIndexOf() tagastavad -1, kui teksti ei ole leitud</p>
    <p id="someText"></p>

    <p>search()</p>
    <p id="searchText"></p>

    <p>Teha matchiga üks sõna otsing</p>

    <p id="someArray"></p>
    <p id="someArray2"></p>
    <p id="matchText"></p>

    <p id="dogText"></p>
    <p id="includeText"></p>
</body>

<script>
    let someText = "Mul on sinine auto ja on esiratta veoga";
    
    let locateWord = someText.lastIndexOf("Anna");
    document.getElementById("someText").innerHTML = locateWord;

    let searchText = someText.search(/ja/);
    document.getElementById("searchText").innerHTML = searchText;

    const someArray = someText.match("on");
    document.getElementById("someArray").innerHTML = someArray.length + " " + someArray;

    //tahan selliset tulemustL 2 on, on
    const someArray2 = someText.match(/on/g); //g on case sensitive--> gi ei ole
    document.getElementById("someArray2").innerHTML = someArray2.length + " " + someArray2;

    let matchText = someText.match("sinine");
    document.getElementById("matchText").innerHTML = matchText;

    let dogText = "Koerad on toredad. Neile meeldib palju õues liikuda. Koerad on populaarsed";
    const iterator = dogText.matchAll("Koer");
    document.getElementById("dogText").innerHTML = Array.from(iterator);

    document.getElementById("includeText").innerHTML = dogText.includes("on") // bool
</script>

</html>
